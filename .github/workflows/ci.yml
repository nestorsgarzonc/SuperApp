name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth/ms, control-de-accesos/ms, notificaciones/ms]
    defaults:
      run:
        working-directory: back/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: back/${{ matrix.service }}/go.mod
          cache-dependency-path: back/${{ matrix.service }}/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The whole stack from the committed Dockerfiles, exactly as a developer runs
  # it (`docker compose up --build`), then the end-to-end smoke test.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test (through the front's nginx)
        run: scripts/smoke.sh
      - name: Second boot on the same volumes (init jobs are idempotent)
        run: |
          docker compose down
          docker compose up --detach --wait --wait-timeout 180
          scripts/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
