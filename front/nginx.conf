server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Matches MAX_BODY_BYTES of the gateway (1 MiB).
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append): the gateway trusts this value for per-IP limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  # Hashed build assets can be cached forever; index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Push service worker must always be fresh.
  location = /firebase-messaging-sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA: unknown paths render the app (react-router).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
