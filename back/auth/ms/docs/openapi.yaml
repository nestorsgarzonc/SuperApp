openapi: 3.0.3
info:
  title: SuperApp Auth MS
  version: 1.0.0
  description: Auth API; user/role administration is permission protected.
servers:
  - url: http://localhost:8081/api/v1
paths:
  /auth/login:
    post:
      summary: Authenticate credentials and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200': { description: User and access/refresh token pair }
        '401': { description: Credentials rejected with generic response }
  /auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: New token pair }
        '401': { description: Invalid, expired, revoked, or replayed refresh token }
  /auth/logout:
    post:
      summary: Revoke the session associated with a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Session revoked (idempotent) }
  /auth/logout-all:
    post:
      security: [{ bearerAuth: [] }]
      summary: Revoke all sessions for the authenticated user
      responses:
        '204': { description: All sessions revoked }
        '401': { description: Access token required }
  /users:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a user (global auth.users.manage permission)
      responses:
        '201': { description: User created }
        '403': { description: Permission denied }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ bearerAuth: [] }]
      summary: Get self or (with global auth.users.read) another user
      responses:
        '200': { description: User profile; password hash is never returned }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update profile and/or status (global auth.users.manage)
      responses:
        '204': { description: User updated }
  /users/{id}/roles:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ bearerAuth: [] }]
      summary: List effective roles for a user
      responses:
        '200': { description: Effective roles }
    post:
      security: [{ bearerAuth: [] }]
      summary: Assign role to user (global auth.users.manage)
      parameters:
        - { name: X-Tenant-ID, in: header, required: false, schema: { type: string, format: uuid } }
        - { name: X-Gateway-Timestamp, in: header, required: false, schema: { type: integer, format: int64 } }
        - { name: X-Gateway-Signature, in: header, required: false, schema: { type: string } }
        - { name: X-Gateway-Membership-Timestamp, in: header, required: false, schema: { type: integer, format: int64 } }
        - { name: X-Gateway-Membership-Signature, in: header, required: false, schema: { type: string } }
      responses:
        '201': { description: Role assigned }
        '403': { description: Missing or invalid signed assertion that the target user belongs to the tenant }
  /users/{id}/roles/{roleId}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Revoke a role assignment (global auth.users.manage)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Assignment revoked }
  /users/{id}/permissions:
    get:
      security: [{ bearerAuth: [] }]
      summary: List effective permission codes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Tenant-ID, in: header, required: false, schema: { type: string, format: uuid } }
        - { name: X-Gateway-Timestamp, in: header, required: false, schema: { type: integer, format: int64 } }
        - { name: X-Gateway-Signature, in: header, required: false, schema: { type: string } }
      responses:
        '200': { description: Effective permission codes }
  /roles:
    get:
      security: [{ bearerAuth: [] }]
      summary: List system roles and roles in verified tenant context
      responses:
        '200': { description: Roles }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a system or tenant role
      responses:
        '201': { description: Role created }
  /roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Role }
    patch:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Role updated }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Role deleted }
  /roles/{id}/permissions:
    post:
      security: [{ bearerAuth: [] }]
      summary: Assign permission to role
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Permission assigned }
  /roles/{id}/permissions/{permissionId}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Remove permission from role
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: permissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Permission removed }
  /permissions:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Permission catalog }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create permission (global auth.roles.manage)
      responses:
        '201': { description: Permission created }
  /permissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Permission }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update permission (global auth.roles.manage)
      responses:
        '200': { description: Permission updated }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete permission (global auth.roles.manage)
      responses:
        '204': { description: Permission deleted }
  /auth/check-permission:
    post:
      security: [{ bearerAuth: [] }]
      summary: Check permission for self or globally authorized user
      responses:
        '200': { description: Boolean allowed result }
  /sessions:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active sessions belonging to caller }
  /sessions/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Session revoked }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
