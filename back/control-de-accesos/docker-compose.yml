services:
  db:
    image: postgres:18.6-alpine
    container_name: control_de_accesos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: control_de_accesos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: control_de_accesos
      # postgres:18+ rejects a fresh volume mounted directly at
      # /var/lib/postgresql/data (new pg_ctlcluster layout).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - control_de_accesos_db:/var/lib/postgresql/data
      # Migraciones + datos de demostración (solo dev) en el primer arranque, vía docker-init.sh.
      - ./db/migrations:/sql/migrations:ro
      - ./db/seeds:/sql/seeds:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_de_accesos -d control_de_accesos"]
      interval: 5s
      timeout: 3s
      retries: 10

  ms:
    build:
      context: ./ms
      args:
        GO_TAGS: dev   # incluye /dev/* y el simulador del sistema QR (nunca en producción)
    container_name: control_de_accesos_ms
    restart: unless-stopped
    environment:
      ENV: development
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Identidad que reenvía el api-gateway (X-Gateway-Secret) y llamadas /internal/* (X-Internal-Secret).
      # Vacío = no se aceptan / /internal no se monta.
      GATEWAY_SECRET: ${GATEWAY_SECRET:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: control_de_accesos
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: control_de_accesos
      DB_SSLMODE: disable
      # Redis del servicio notificaciones (stream notifications.requested). Vacío = desactivado.
      REDIS_URL: ${REDIS_URL:-}
      # Circuit breaker del sistema QR (ver docs/control-de-accesos.md)
      QR_BREAKER_FAILURES: ${QR_BREAKER_FAILURES:-3}
      QR_BREAKER_OPEN_SECONDS: ${QR_BREAKER_OPEN_SECONDS:-10}
      QR_CALL_TIMEOUT_MS: ${QR_CALL_TIMEOUT_MS:-800}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  control_de_accesos_db:
