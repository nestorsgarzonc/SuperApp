# Base solo de este módulo. El esquema no se carga al crear el contenedor:
# igual que auth, lo aplica `go run ./cmd/setup` desde ms/.
services:
  access-db:
    image: postgres:18.6-alpine
    container_name: control_accesos_db
    environment:
      POSTGRES_USER: accesos
      POSTGRES_PASSWORD: accesos
      POSTGRES_DB: control_accesos
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${ACCESS_DB_PORT:-5433}:5432"
    volumes:
      - access_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesos -d control_accesos"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  access_db_data:
