# Entorno local aislado del feature notificaciones: su propia db + Redis.
#   docker compose up -d db redis && docker compose run --rm migrate
#   docker compose up ms
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notificaciones
      POSTGRES_PASSWORD: notificaciones
      POSTGRES_DB: notificaciones
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificaciones"]
      interval: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["6380:6379"]

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes: ["./db/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://notificaciones:notificaciones@db:5432/notificaciones?sslmode=disable", "up"]
    depends_on:
      db: { condition: service_healthy }

  ms:
    build: ./ms
    environment:
      ENV: development
      PORT: "8083"
      DATABASE_URL: postgres://notificaciones:notificaciones@db:5432/notificaciones?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports: ["8083:8083"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
